name: Checks

# Every push and pull request: nothing of the game in the tracked files (keys, dumps, the game's files), which would be
# grounds to take the repository down. The builds run when a version is tagged (release.yml), or by hand.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tracked-material:
    name: Nothing of the game in the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/tracked_material.py --self-test
      - run: python3 tests/tracked_material.py .
